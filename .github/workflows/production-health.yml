name: Production health monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check application and Supabase Auth availability
        run: |
          http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 https://financepessoal.vercel.app/api/health)
          if [ "$http_status" != "200" ]; then
            echo "Health check failed (HTTP $http_status)."
            exit 1
          fi
          echo "Application and Supabase Auth are available."
